name: Admission ID Scanner

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL for the result page'
        required: false
        default: 'https://localhost:0000/result2026/Result_2026.aspx'

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run ID Scanner Script
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: |
          python main.py

      - name: Upload Results CSV Artifact
        uses: actions/upload-artifact@v4
        with:
          name: found-students-results
          path: found_students.csv
          retention-days: 7
